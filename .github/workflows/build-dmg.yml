# Builds "Remind Me.dmg" on a GitHub-hosted Mac (which has full Xcode, so
# the SwiftUI/SwiftData macro plugins are available) and publishes it as a
# GitHub Release, so the raw .dmg (not zipped) is downloadable from the
# repo's Releases page.
#
# Runs on every push to main, or by hand: Actions tab -> Build DMG -> Run workflow.
name: Build DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    # Intel runner, cross-compiling the Apple Silicon app (build.sh passes
    # --arch arm64). The free Apple Silicon pools (macos-latest, macos-15)
    # kept cancelling jobs for lack of capacity.
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Run tests
        run: |
          set -o pipefail
          swift test --skip UIPreviewTests 2>&1 | tee test.log

      # Surface the results as annotations (readable via the API without
      # downloading the full log). Runs whether tests passed or failed.
      - name: Report test results
        if: always()
        run: |
          [ -f test.log ] || exit 0
          summary=$(grep -E "Executed [0-9]+ tests?" test.log | tail -1)
          echo "::notice title=Test summary::${summary:-no summary line found}"
          grep -E "error:|: error|failed \(|warning: .*Sources/RemindMe" test.log \
            | grep -v "^\s*$" | awk '!seen[$0]++' | head -60 > problems.txt || true
          if [ -s problems.txt ]; then
            body=$(sed 's/%/%25/g' problems.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test problems::${body}"
          fi

      # Renders the real SwiftUI reminder card, all faces, the animation
      # frames and the menu bar icon to PNGs, attached to the Release.
      # Never blocks the build if rendering misbehaves on the CI machine.
      - name: Render UI previews
        continue-on-error: true
        run: |
          set -o pipefail
          PREVIEW_DIR="$PWD/previews" swift test --filter UIPreviewTests 2>&1 | tail -20
          ls -la previews || true

      - name: Build and package
        run: |
          chmod +x build.sh
          ./build.sh
          # Must be an Apple Silicon binary even when built on Intel.
          lipo -archs "dist/Remind Me.app/Contents/MacOS/RemindMe" | grep -qx arm64

      - name: Publish .dmg as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub turns spaces in asset names into dots, so give it a clean name.
          cp "dist/Remind Me.dmg" "Remind-Me.dmg"
          TAG="build-${GITHUB_RUN_NUMBER}"
          shopt -s nullglob
          gh release create "$TAG" "Remind-Me.dmg" previews/*.png \
            --title "Remind Me (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open the .dmg and drag Remind Me into Applications. First launch: right-click > Open, or System Settings > Privacy & Security > Open Anyway."
